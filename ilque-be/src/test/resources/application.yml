# 테스트 전용 설정.
#
# 이 파일은 테스트 클래스패스에서 메인 `src/main/resources/application.yml`을
# 가린다(shadow). 테스트 JVM은 테스트 리소스를 메인 리소스보다 먼저 읽으므로,
# `classpath:/application.yml`은 이 파일로 해석되고 메인 설정은 로드되지 않는다.
# 따라서 테스트에 필요한 설정 키를 이 파일에도 모두 명시해야 한다.
#
# - DB: 테스트 전용 경로(`build/ilque-test.db`)만 사용한다. 개발용 DB인
#   `./data/ilque.db`는 여기에 두지 않으며 fallback으로도 사용되지 않는다.
# - DDL: `create-drop`으로 매 테스트 컨텍스트마다 스키마를 생성/삭제하되,
#   이 DDL은 테스트 DB에만 적용된다. 개발 DB에는 어떤 DDL도 실행되지 않는다.
spring:
  application:
    name: ilque-be

  datasource:
    url: jdbc:sqlite:./build/ilque-test.db?journal_mode=WAL&synchronous=NORMAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
